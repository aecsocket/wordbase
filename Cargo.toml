[workspace]
members = [
  "src/jmdict-furigana",
  "src/wordbase",
  "src/wordbase-api",
  "src/wordbase-cli",
  "src/wordbase-desktop",
  "src/wordbase-gtk",
  "src/wordbase-sys",
  "src/wordbase-uniffi-bindgen",
]
resolver = "3"

[workspace.package]
authors      = ["aecsocket <aecsocket@tutanota.com>"]
categories   = []
edition      = "2024"
keywords     = []
license      = "Proprietary"                           # TODO
repository   = "https://github.com/aecsocket/wordbase"
rust-version = "1.88.0"

[workspace.lints.rust]
missing_docs    = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"

assigning_clones        = "allow"
cast_precision_loss     = "allow"
cognitive_complexity    = "allow"
missing_const_for_fn    = "allow"
module_name_repetitions = "allow"
struct_field_names      = "allow"
too_many_arguments      = "allow"
too_many_lines          = "allow"
type_complexity         = "allow"

[workspace.dependencies]
jmdict-furigana  = { path = "src/jmdict-furigana" }
wordbase         = { path = "src/wordbase" }
wordbase-desktop = { path = "src/wordbase-desktop" }
# wordbase-ankiconnect = { path = "src/wordbase-ankiconnect" }
# wordbase-client-tokio = { path = "src/wordbase-client-tokio" }
wordbase-api = { path = "src/wordbase-api" }
# wordbase-server = { path = "src/wordbase-server" }

adw                  = { package = "libadwaita", version = "0.7.2" }
android_logger       = { version = "0.15.0" }
ankiconnect          = { version = "0.2" }
anyhow               = { version = "1.0" }
arc-swap             = { version = "1.7" }
ascii_table          = { version = "4.0" }
ashpd                = { version = "0.11" }
async-channel        = { version = "2.5.0" }
async-compression    = { version = "0.4" }
async-stream         = { version = "0.3.6" }
async-tar            = { version = "0.5" }
async_zip            = { version = "0.0.17" }
bimap                = { version = "0.6" }
bytes                = { version = "1.10" }
bzip2                = { version = "0.5" }
cfg-if               = { version = "1.0" }
clap                 = { version = "4.5" }
criterion            = { version = "0.7" }
data-encoding        = { version = "2.9" }
derive_more          = { version = "2.0" }
dioxus               = { version = "0.6" }
directories          = { version = "6.0" }
distance             = { version = "0.4" }
either               = { version = "1.15" }
eyre                 = { version = "0.6.12" }
foldhash             = { version = "0.1.4" }
form_urlencoded      = { version = "1.2" }
futures              = { version = "0.3" }
genawaiter           = { version = "0.99" }
gio                  = { version = "0.20.9" }
glib                 = { version = "0.20" }
gtk                  = { package = "gtk4", version = "0.9" }
heed                 = { version = "0.22" }
hex                  = { version = "0.4" }
html-escape          = { version = "0.2" }
humansize            = { version = "2.1" }
indexmap             = { version = "2.8" }
itertools            = { version = "0.14" }
libspa               = { version = "0.8" }
lindera              = { version = "1.1.2" }
maud                 = { version = "0.27" }
mecab                = { version = "0.1.6" }
notify               = { version = "8.0" }
paste                = { version = "1.0" }
pin-project          = { version = "1.1" }
pipewire             = { version = "0.8" }
poem                 = { version = "3.1.9" }
poem-openapi         = { version = "5.1" }
quote                = { version = "1.0" }
rand                 = { version = "0.9" }
rayon                = { version = "1.11" }
redb                 = { version = "3.0" }
regex                = { version = "1.11" }
relm4                = { version = "0.9.1" }
relm4-icons          = { version = "0.10.0-beta.2" }
relm4-icons-build    = { version = "0.10.0-beta.2" }
reqwest              = { version = "0.12.15", default-features = false }
rkyv                 = { version = "0.8.11" }
rmp-serde            = { version = "1.3" }
rocksdb              = { version = "0.24" }
rustyline            = { version = "15.0" }
serde                = { version = "1.0" }
serde_json           = { version = "1.0" }
serde_repr           = { version = "0.1" }
sha2                 = { version = "0.10" }
sqlx                 = { version = "0.8" }
tempfile             = { version = "3.22" }
tera                 = { version = "1.20" }
tokio                = { version = "1.44.2" }
tokio-stream         = { version = "0.1" }
tokio-tungstenite    = { version = "0.26" }
tokio-util           = { version = "0.7" }
tracing              = { version = "0.1" }
tracing-subscriber   = { version = "0.3" }
unicode-segmentation = { version = "1.12" }
uniffi               = { version = "0.29.2" }
uuid                 = { version = "1.18" }
webkit               = { package = "webkit6", version = "0.4" }
xz2                  = { version = "0.1" }
zbus                 = { version = "5.5", default-features = false }
zip                  = { version = "5.1" }

[workspace.metadata.cargo-shear]
ignored = ["bzip2"]

[workspace.metadata.cross.build]
env.passthrough = ["CARGO_TARGET_DIR=target/cross"]
env.volumes = ["LINDERA_CACHE=lindera-cache"]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update && apt-get --assume-yes install libssl-dev:$CROSS_DEB_ARCH",
]

[profile.release]
codegen-units = 1
# lto           = true # unsupported by cranelift
# opt-level = "z"
opt-level = 3
panic     = "abort"
# strip     = true
