[package]
name    = "wordbase"
version = "0.1.0"

authors.workspace      = true
categories.workspace   = true
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
all-storages     = ["storage-heed", "storage-redb", "storage-rocksdb"]
storage-heed     = ["dep:heed"]
storage-redb     = ["dep:redb"]
storage-rocksdb  = ["dep:rocksdb"]
storage-rusqlite = ["dep:rusqlite"]

all-codecs = ["codec-rkyv", "codec-rmp"]
codec-rkyv = ["dep:rkyv"]
codec-rmp  = ["dep:rmp-serde"]

[dependencies]
arc-swap             = { workspace = true }
async-channel        = { workspace = true }
async-stream         = { workspace = true }
bytes                = { workspace = true }
color-eyre           = { workspace = true }
data-encoding        = { workspace = true }
distance             = { workspace = true }
either               = { workspace = true }
eyre                 = { workspace = true }
foldhash             = { workspace = true }
futures              = { workspace = true }
heed                 = { workspace = true, optional = true }
indexmap             = { workspace = true, features = ["serde"] }
itertools            = { workspace = true }
lindera              = { workspace = true, features = ["embedded-unidic"] }
maud                 = { workspace = true }
paste                = { workspace = true }
pin-project          = { workspace = true }
poem-openapi         = { workspace = true, optional = true }
rayon                = { workspace = true }
redb                 = { workspace = true, optional = true }
regex                = { workspace = true }
rmp-serde            = { workspace = true, optional = true }
rocksdb              = { workspace = true, optional = true }
rusqlite             = { workspace = true, optional = true, features = ["bundled"] }
serde                = { workspace = true, features = ["derive"] }
serde_json           = { workspace = true, features = ["preserve_order"] }
serde_repr           = { workspace = true }
# sqlx                 = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tera                 = { workspace = true, features = ["preserve_order"] }
tokio                = { workspace = true, features = ["sync", "macros"] }
tokio-stream         = { workspace = true }
tokio-util           = { workspace = true, features = ["rt"] }
tracing              = { workspace = true }
unicode-segmentation = { workspace = true }
uniffi               = { workspace = true, optional = true, features = ["tokio"] }
uuid                 = { workspace = true }
wordbase-api         = { workspace = true, features = ["serde", "rkyv"] }
zip                  = { workspace = true }

derive_more = { workspace = true, features = [
  "debug",
  "from",
  "display",
  "error",
  "deref",
  "deref_mut",
] }
rkyv = { workspace = true, optional = true, features = [
  # this isn't ideal, but rocksdb doesn't let us enforce alignment guarantees
  # and without `unaligned` rkyv requires 8-byte alignment for records
  # fortunately, enabling this doesn't seem to decrease performace too bad on x86?
  "unaligned",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"]}
ascii_table        = { workspace = true, features = ["wide_characters"] }
clap               = { workspace = true, features = ["derive"] }
humansize          = { workspace = true }
tempfile           = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wordbase           = { path = ".", features = ["all-storages", "all-codecs"] }
