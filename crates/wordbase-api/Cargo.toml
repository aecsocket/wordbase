[package]
description = "Dictionary and word lookup service - API types"
name        = "wordbase-api"
version     = "0.1.0"

authors.workspace      = true
categories.workspace   = true
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
poem        = ["dep:poem", "dep:poem-openapi"]
render-html = ["dep:maud"]
rkyv        = ["dep:rkyv"]
serde       = ["dep:serde"]
uniffi      = ["dep:uniffi", "dep:data-encoding"]

[dependencies]
bytes         = { workspace = true, features = ["serde"] }
data-encoding = { workspace = true, optional = true }
itertools     = { workspace = true }
maud          = { workspace = true, optional = true }
paste         = { workspace = true }
poem          = { workspace = true, optional = true }
poem-openapi  = { workspace = true, optional = true, features = ["uuid"] }
rkyv          = { workspace = true, optional = true, features = ["bytes-1", "uuid-1"] }
serde         = { workspace = true, optional = true, features = ["derive"] }
serde_json    = { workspace = true }
uniffi        = { workspace = true, optional = true }
uuid          = { workspace = true, features = ["serde", "v7"] }

derive_more = { workspace = true, features = [
  "debug",
  "display",
  "from",
  "error",
  "deref",
  "deref_mut",
] }
