[package]
name = "wordbase-server-http"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-stream = { workspace = true, optional = true }
bytes = { workspace = true }
directories = { workspace = true }
eyre = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tracing = { workspace = true }
wordbase-engine = { workspace = true }
wordbase-types = { workspace = true, features = ["utoipa"] }
axum = { workspace = true, features = ["macros"] }
foldhash = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum", "vendored"] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true }
derive_more = { workspace = true, features = ["display", "error"]}

[lints]
workspace = true
