[package]
name = "wordbase-types"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes = { workspace = true }
data-encoding = { workspace = true, optional = true }
derive_more = { workspace = true, features = [
  "debug",
  "deref",
  "deref_mut",
  "display",
  "error",
  "from",
] }
itertools = { workspace = true }
maud = { workspace = true, optional = true }
poem = { workspace = true, optional = true }
poem-openapi = { workspace = true, features = ["uuid"], optional = true }
rkyv = { workspace = true, features = ["bytes-1", "uuid-1"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v7"] }

[features]
poem = ["dep:poem", "dep:poem-openapi"]
render-html = ["dep:maud"]
rkyv = ["dep:rkyv"]
serde = ["bytes/serde", "dep:serde", "dep:serde_json", "uuid/serde"]
uniffi = ["dep:data-encoding", "dep:uniffi"]

[lints]
workspace = true
