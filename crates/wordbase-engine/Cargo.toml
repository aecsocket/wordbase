[package]
name = "wordbase-engine"

authors.workspace      = true
categories.workspace   = true
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
uniffi = ["dep:uniffi"]

[dependencies]
wordbase-api = { workspace = true }
wordbase-storage = { workspace = true, features = [
  "backend-rocksdb",
  "codec-rkyv",
] }
wordbase-deinflect = { workspace = true }

futures = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
eyre          = { workspace = true }
foldhash      = { workspace = true }
itertools     = { workspace = true }
rayon         = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true, features = ["preserve_order"] }
sqlx          = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tokio         = { workspace = true, features = ["sync", "macros", "fs"] }
tracing       = { workspace = true }
uniffi        = { workspace = true, optional = true }
uuid          = { workspace = true }

derive_more = { workspace = true, features = ["deref"] }
