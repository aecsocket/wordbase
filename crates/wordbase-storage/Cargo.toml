[package]
name = "wordbase-storage"

authors.workspace      = true
categories.workspace   = true
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
uniffi = ["dep:uniffi"]

[dependencies]
wordbase-api             = { workspace = true }
wordbase-storage-api     = { workspace = true }
wordbase-storage-backend = { workspace = true }
wordbase-storage-import  = { workspace = true }

async-channel = { workspace = true }
color-eyre    = { workspace = true }
eyre          = { workspace = true }
rayon         = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true, features = ["preserve_order"] }
tokio         = { workspace = true, features = ["sync", "macros", "fs"] }
tracing       = { workspace = true }
uniffi        = { workspace = true, optional = true }

[dev-dependencies]
ascii_table        = { workspace = true, features = ["wide_characters"] }
clap               = { workspace = true, features = ["derive"] }
humansize          = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

wordbase-storage-backend = { workspace = true, features = [
  "all-backends",
  "all-codecs",
] }
