[package]
name = "wordbase-storage"

authors.workspace      = true
categories.workspace   = true
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
all-backends = [
  "backend-heed",
  "backend-redb",
  "backend-rocksdb",
  "backend-libsql",
]

backend-heed    = ["wordbase-storage-backend/backend-heed"]
backend-libsql  = ["wordbase-storage-backend/backend-libsql"]
backend-redb    = ["wordbase-storage-backend/backend-redb"]
backend-rocksdb = ["wordbase-storage-backend/backend-rocksdb"]
# backend-turso   = ["wordbase-storage-backend/backend-turso"]

all-codecs = ["codec-rkyv", "codec-rmp"]

codec-rkyv = ["wordbase-storage-backend/codec-rkyv"]
codec-rmp  = ["wordbase-storage-backend/codec-rmp"]

[dependencies]
wordbase-api             = { workspace = true }
wordbase-storage-api     = { workspace = true }
wordbase-storage-backend = { workspace = true }
wordbase-storage-import  = { workspace = true }

async-channel = { workspace = true }
color-eyre    = { workspace = true }
eyre          = { workspace = true }
rayon         = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true, features = ["preserve_order"] }
tokio         = { workspace = true, features = ["sync", "macros", "fs", "rt"] }
tracing       = { workspace = true }
uniffi        = { workspace = true, optional = true }

[dev-dependencies]
ascii_table        = { workspace = true, features = ["wide_characters"] }
clap               = { workspace = true, features = ["derive"] }
humansize          = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
disqualified = { workspace = true }
